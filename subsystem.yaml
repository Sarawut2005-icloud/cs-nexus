# manifest ของระบบย่อย — CI และ conformance อ่านไฟล์นี้ไฟล์เดียว
# schema: standards/schemas/subsystem.schema.json
#
# เขียนตาม standards/templates/subsystem.yaml v1.0.0
# ฉบับก่อนหน้าเขียนตาม Blueprint ฉบับ API Gateway ซึ่งถูกยกเลิกไปแล้ว
# (auth-contract.md ข้อ 1) — ฟิลด์ที่หายไปคือฟิลด์ที่สัญญาใหม่ไม่มี ไม่ใช่ตกหล่น

name: csmju-social-reels # ต้องตรงกับทะเบียนใน Core Hub และกับ data.service ของ /api/health
standards_version: "1.0.0"
conformance_level: L3 # ระบบนี้มี UI จึงต้องถึง L3

display_name: "CS Nexus — สังคมออนไลน์ วิดีโอสั้น และห้องคอลประจำสาขา"
repo: github.com/Sarawut2005-icloud/cs-nexus
# TODO(PL): ถ้าย้ายเข้า org กลาง (github.com/CSMJU2030/…) ให้ transfer repo
# แล้วแก้บรรทัดบนให้ตรง อย่าปล่อยให้ชี้ไปที่ที่ไม่มีอยู่จริง

base_url: http://localhost:4000 # URL ของระบบย่อยตอนรันเพื่อทดสอบ
core_hub_url: http://localhost:3000
callback_path: /auth/callback # ต้องตรงกับ callback_url ที่ลงทะเบียนไว้

# ── เส้นทางที่เรียกได้โดยไม่ต้องมี token ──────────────────────────────
#
# สัญญาอนุญาตแค่สองเส้นนี้ (api-conventions.md ข้อ 1) เส้นอื่นที่โผล่มาในนี้
# คือช่องโหว่ ไม่ใช่ความสะดวก
public_endpoints:
  - GET /api/health
  - GET /auth/callback

# ── Layer 1 → Layer 2 ────────────────────────────────────────────────
#
# **ต้องตรงกับ `DEFAULT_ROLE_MAPPING` ใน backend/src/auth/role-mapping.ts เป๊ะ**
# key ของตารางนี้คือรายชื่อ core role ที่ Core Hub จะปล่อยให้เข้าระบบนี้
# (authorization.md ข้อ 3) — ถ้าสองที่ไม่ตรงกัน ผู้ใช้จะเข้าได้แต่กดอะไรไม่ได้
default_role_mapping:
  student: GUEST
  alumni: GUEST
  staff: EDITOR
  admin: ADMIN

# `reason` **บังคับ** — `RequestedExceptionDto` ของ Core Hub ใช้ @MinLength(1)
# ถ้าไม่มี POST /api/v1/subsystems จะตอบ 400 (ยืนยันจากโค้ดจริงเมื่อ 27 ก.ย. 2569)
requested_exceptions:
  - username: 6704101382-anuchat
    role: ADMIN
    reason: >-
      เจ้าของระบบต้องเข้าหน้าจัดการเนื้อหาของระบบย่อยได้ (ลบคลิปที่ถูกรายงาน
      ปลดแบนผู้ใช้ ดู audit log) แต่ core role เป็น student ซึ่ง
      default_role_mapping แปลงเป็น GUEST

# ── probes ที่ conformance ใช้ตรวจสัญญา API ระดับ L2 ขึ้นไป ───────────
#
# ประกาศไม่ครบ = ขึ้น SKIP = **ยังไม่ผ่าน** (conformance.md ข้อ 3)
probes:
  collection: /api/v1/reels
  not_found: /api/v1/reels/99999999-9999-4999-8999-999999999999
  invalid_id: /api/v1/reels/not-a-uuid
  create:
    path: /api/v1/posts
    allowed_role: staff
    denied_role: student
    invalid_body:
      title: ""
    valid_body:
      title: Conformance Probe
      content: ข้อความทดสอบจากชุด conformance

owners:
  pl: "@csmju2030/pl-social-reels"
  aie: "@csmju2030/aie-social-reels"

# ─────────────────────────────────────────────────────────────────────
# ส่วนต่อจากนี้ไม่ได้อยู่ใน schema กลาง (schema เปิด additionalProperties)
# มีไว้ให้ PM ตรวจได้ว่าระบบย่อยนี้แตะอะไรและไม่แตะอะไร
# ─────────────────────────────────────────────────────────────────────

api:
  prefix: /api/v1
  health_check: /api/health # ไม่มีเลขเวอร์ชันตาม vocabulary.json
  openapi: backend/openapi.json # เขียนใหม่ทุกครั้งที่บูต จึงตรงกับโค้ดเสมอ
  endpoint_count: 68
  websocket:
    namespace: /realtime
    # TODO(PL): WebSocket ยังยืนยันตัวตนด้วยกลไกเดิม (header + ตั๋วชั่วคราว)
    # ต้องย้ายไปใช้ token ของ Core Hub ให้ตรงกับ HTTP — ดู
    # docs/ช่องว่างกับมาตรฐาน-v1.0.md ระยะ 3
    auth: legacy_header_or_short_lived_ticket

# ── ชั้นหน้าจอ (ui-design-system.md ข้อ 19.2) ─────────────────────────
#
# ประกาศตามจริง: **ยังไม่ได้ใช้ @csmju2030/design-system**
# สองเหตุผล และทั้งสองข้อไม่ได้อยู่ในมือเรา
#
#   1. ติดตั้งไม่ได้ — package อยู่บน GitHub Packages ต้องมี PAT ที่มีสิทธิ์
#      read:packages ซึ่งยังไม่ได้รับ
#   2. design-system v1.3.0 สร้างตามสัญญาที่ standards v1.0.0 ยกเลิกไปแล้ว
#      (/oauth/token · claim username/faculty · meta per_page) รอ PM ชี้ขาด
#
# รายละเอียดพร้อมหลักฐาน: docs/design-system-กับสัญญาที่ขัดกัน.md
ui:
  design_system_version: null # ยังไม่ได้ติดตั้ง — ดูเหตุผลด้านบน
  design_system_status: blocked_on_pat_and_pm_ruling
  theme: light+dark # globals.css มีครบทั้งสองโหมด
  tailwind: "4" # preset ของ design system เป็น v3 — ต้องยืนยันก่อนย้าย
  app_shell: false # ยังวาด header/sidebar เอง (DS-01) เพราะไม่มี <CsmjuAppShell>

  # เมนูหลัก — ต้องตรงกับ NAV ใน frontend/src/app/(app)/layout.tsx
  nav:
    - { label: "ฟีดชุมชน", path: "/feed" }
    - { label: "คลิปสั้น", path: "/reels" }
    - { label: "ข้อความ", path: "/messages" }
    - { label: "การแจ้งเตือน", path: "/notifications" }
    - { label: "ห้องแชท", path: "/chat" }
    - { label: "ห้องเสียง", path: "/voice" }
    - { label: "นัดประชุม", path: "/meetings" }
    - { label: "ค้นหา", path: "/search" }
    - { label: "ที่บันทึกไว้", path: "/saved" }
    - { label: "แผงผู้ดูแล", path: "/admin" }

  # component ที่เราเขียนเอง — ตาม ui-design-system.md ทุกตัวต้องมีเลข issue
  # กำกับ ตอนนี้ยังไม่มี เพราะยังไม่ได้ยื่นขอ (ยื่นไม่ได้จนกว่าจะติดตั้ง package
  # แล้วรู้ว่าตัวไหนซ้ำกับของส่วนกลางจริง)
  local_components: pending_issue

  # ผลตรวจด้วย csmju-ui-lint ของ design system (รันเมื่อ 27 ก.ย. 2569)
  ui_lint:
    tool_version: "1.3.0"
    enforced_by_ci: false # PR check-ui-designsystem.sh ยังไม่ถูก merge เข้า standards
    errors: 35
    warnings: 145
    # ที่เหลือแยกเป็นสามกอง ดูรายละเอียดใน docs/design-system-กับสัญญาที่ขัดกัน.md

modules:
  - subsystem-members # สิทธิ์ Layer 2 + โควตาพื้นที่
  - profiles # โปรไฟล์ + แคชชื่อจาก Core
  - follows # กราฟการติดตาม + ฟีด
  - notifications # แจ้งเตือน + ผลักผ่าน socket
  - assets # อัปโหลดสามจังหวะ + ตรวจ magic bytes
  - reels # คลิปสั้น ไลก์ คอมเมนต์ ยอดผู้ชม
  - posts # กระดานข่าว Q&A ตามรายวิชา
  - channels # แชท เธรด ปักหมุด แก้ข้อความ
  - realtime # Socket.io gateway + ตั๋ว
  - voice # ห้องเสียง WebRTC mesh + แชร์หน้าจอ
  - reactions # อิโมจิบนแชท/โพสต์/คลิป
  - bookmarks # บันทึกไว้ดูทีหลัง
  - search # ค้นคลิป กระทู้ คน ข้อความ
  - reports # แจ้งเนื้อหา + คิวผู้ดูแล
  - meetings # นัดประชุมล่วงหน้าแบบ Teams
  - stories # สตอรี่ 24 ชั่วโมง (หมดอายุตอนอ่าน ไม่ต้องมี cron)
  - presence # ใครออนไลน์ทั่วระบบ (ในหน่วยความจำ ไม่ลงฐานข้อมูล)
  - audit-logs # เปิดให้ Admin Panel กลางอ่าน
  - auth # ตรวจ JWT ผ่าน JWKS + SSO callback + /api/v1/me

# สถานะการทำตามข้อห้ามของสัญญา v1.0 — รายงานตามจริง ไม่ใช่ตามที่อยากให้เป็น
compliance:
  own_login_page: false # ไม่มีหน้า login และไม่มีช่องรับรหัสผ่าน
  verifies_jwt_via_jwks: true # ตรวจเองด้วย jose ครบ 8 ขั้น (SEC-04 บังคับให้ตรวจ)
  issues_own_tokens: false # session คือ token ของ Core Hub ที่ verify แล้ว
  frontend_touches_database: false # หน้าบ้านคุยกับ backend เท่านั้น
  response_envelope: true # { success, data, meta } ทุก endpoint
  closed_error_codes: true # 7 ค่าตาม contracts/error-codes.json
  camel_case_json: true
  snake_case_database: true # ผ่าน @map/@@map
  iso8601_timestamps: true

  # ── ที่ยังไม่ผ่าน — ระบุไว้ตรง ๆ ไม่ปิดบัง ───────────────────────
  identity_key_is_core_user_id: false
  # ยังใช้ `username` เป็นคีย์ตัวตนอยู่ ทั้งที่ token ของ Core Hub ไม่ส่งค่านี้
  # มาให้ (data-dictionary.md ข้อ 1.2) — ต้องย้ายไป `coreUserId` ทั้งระบบ
  # กระทบ 84 ไฟล์ · 68 endpoint · ทุกตาราง
  # ดู docs/ช่องว่างกับมาตรฐาน-v1.0.md ระยะ 3

  dependencies_within_whitelist: false
  # มี dependency 19 ตัวที่ยังไม่อยู่ใน allowed-deps.json — ยื่นขอแล้ว
  # ดู docs/ร่าง-issue-ถึง-standards.md Issue 1

data_ownership:
  local_only:
    - layer2_role # Local Data นิยามเองได้
    - layer2_role_explicit # แยก "ผู้ดูแลตั้งเอง" ออกจาก "แปลงมาจาก core role"
    - bio # ข้อความแนะนำตัวที่เขียนเพื่อชุมชนนี้ (เนื้อหา ไม่ใช่ตัวตน)
    - รูปปกโปรไฟล์ (ไม่ใช่รูปโปรไฟล์ ซึ่งเป็นของ Core)
    - storage_quota_bytes
    - เนื้อหาที่ผู้ใช้สร้างในระบบย่อยนี้ (คลิป กระทู้ ข้อความ ไฟล์แนบ)
    - กราฟการติดตาม รีแอ็กชัน บุ๊กมาร์ก แจ้งเตือน
  cached_from_core:
    - display_name # ตาราง profile_cache · TTL 6 ชั่วโมง · ไม่ใช่แหล่งความจริง
    - avatar_url
  # TODO(PL): ยืนยันว่าการแคช display_name แบบนี้ผ่าน data-dictionary.md ข้อ 10
  never_stored:
    - core_role
    - email
    - รหัสผ่านหรือ refresh token ของผู้ใช้

# เพดานที่บังคับที่ชั้น service ไม่ใช่ที่ UI (เพราะ UI เลี่ยงได้)
limits:
  storage_quota_per_user_bytes: 209715200 # 200 MB
  max_admin_settable_quota_bytes: 5368709120 # 5 GB
  voice_seats_per_room: 8 # จากคณิตศาสตร์ของ mesh P2P
  screen_share_viewers: 4
  mentions_per_message: 10
  pinned_messages_per_channel: 50
  message_edit_window_minutes: 15
  socket_messages_per_10s: 20
  reel_duration_ms: 60000
  story_ttl_hours: 24
  story_notify_follower_cap: 50 # เกินนี้ไม่แจ้งเตือน กันช่องแจ้งเตือนล้น
  bio_max_chars: 300

# ── การลงทะเบียนกับ Core Hub ตัวจริง ─────────────────────────────────
#
# ยืนยันกับ github.com/CSMJU2030/csmju-core-hub commit 88a600f เมื่อ 27 ก.ย. 2569
# โดย clone มารันในเครื่องจริง ลงทะเบียนจริง แล้วรับ token จริงมาตรวจ
# ผล: ผ่านครบ · ดู docs/ต่อกับ-core-hub.md และ backend/test/core-hub-live.e2e-spec.ts
#
# ฟิลด์ข้างล่างคือชื่อที่ `CreateSubsystemDto` ของ Core Hub ใช้ (camelCase)
# ซึ่งต่างจากชื่อในไฟล์นี้ (snake_case) — แมปไว้ให้ชัดเพื่อไม่ให้คัดลอกผิด
core_hub_registration:
  endpoint: POST /api/v1/subsystems
  requires_permission: subsystem:create # admin หรือ staff เท่านั้น
  field_mapping:
    name: name
    displayName: display_name
    repo: repo
    standardsVersion: standards_version
    defaultRoleMapping: default_role_mapping
    requestedExceptions: requested_exceptions # ต้องมี reason ไม่งั้น 400
    callbackUrl: base_url + callback_path
    baseUrl: base_url # Monitor จะยิง <baseUrl>/api/health
  # ต้องอนุมัติและเปิดใช้งานก่อน ไม่งั้น sso/handoff ตอบ 409
  after_create:
    - POST /api/v1/subsystems/{id}/approve # approvalStatus -> APPROVED
    - POST /api/v1/subsystems/{id}/activate # status -> ACTIVE
  # key ของ default_role_mapping คือ **รายชื่อคนที่เข้าระบบนี้ได้**
  # core role ที่ไม่อยู่ใน key จะโดน 403 ตั้งแต่ก่อนออก token
  # (SsoService.allowedCoreRoles) ทดสอบแล้ว: ลบ alumni ออก -> alumni ได้ 403
  role_mapping_is_access_list: true
  # TODO(PL): `owner` ต้องเป็น username ของ PL ที่มีบัญชีใน Core Hub
  # ตอนทดสอบใช้ `admin` จาก seed ไปก่อน ยังไม่มีบัญชีจริง
  owner: TBD

depends_on_core:
  - sso_authorize # GET /api/v1/auth/sso/authorize (เบราว์เซอร์เดินทางผ่าน 302)
  - sso_handoff # GET /api/v1/auth/sso/handoff (แบบ JSON — SSO launcher ใช้ตัวนี้)
  - subsystem_registry # POST /api/v1/subsystems + approve + activate
  - jwks # GET /api/v1/.well-known/jwks.json
  # TODO(PL): ต้องการ endpoint ที่แปลง `sub` เป็นชื่อที่แสดงผล
  # data-dictionary.md ข้อ 1.2 บอกว่า GET /api/v1/users/:id ต้องมี permission
  # ขอทราบว่าระบบย่อยขอสิทธิ์นั้นได้อย่างไร ไม่งั้นหน้าจอจะแสดงได้แค่ `sub`
